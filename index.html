<!doctype html>
<html lang="ru" data-theme="rose">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="База конспектов: предметы, темы, разборы анализов и терминов" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Личное инфо — конспекты</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки
      (function () {
        try {
          var saved = localStorage.getItem('lichnoe-info-theme');
          var tg = window.Telegram && window.Telegram.WebApp;
          var theme = saved || (tg && tg.colorScheme === 'dark' ? 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (tg && tg.initData !== undefined) document.documentElement.classList.add('is-telegram');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
